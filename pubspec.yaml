name: reel
description: Lightweight local-only video player and library for Android (libmpv).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_windows_video: ^1.0.11
  window_manager: ^0.5.1
  permission_handler: ^11.3.1
  screen_brightness: ^2.1.0
  path_provider: ^2.1.4
  path: ^1.9.0
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/subfont.ttf
