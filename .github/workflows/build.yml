name: Build AURA (Android + Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android runner if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name reel --org dev.reel
            rm -rf test
          fi

      - name: Patch Android project (permissions, open-with, PiP, SDK)
        run: python3 ci/patch.py

      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Signing key
        env:
          KS: ${{ secrets.REEL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/reel.jks"
            echo "REEL_KEYSTORE=$RUNNER_TEMP/reel.jks" >> "$GITHUB_ENV"
            echo "Using the permanent AURA signing key"
          else
            echo "::warning::No REEL_KEYSTORE_B64 secret - building with a throwaway debug key"
          fi

      - name: Build APK
        env:
          REEL_KEY_PASS: ${{ secrets.REEL_KEY_PASS }}
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk AURA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AURA.apk
          path: AURA.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AURA build ${{ github.run_number }}
          files: AURA.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Windows runner
        shell: bash
        run: |
          if [ ! -d windows ]; then
            flutter create . --platforms=windows --project-name reel --org dev.reel
            rm -rf test
          fi
          python ci/patch_windows.py

      - run: flutter pub get

      - name: Build
        run: flutter build windows --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Package (zip + installer)
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath AURA-Windows-portable.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyVersion=1.0.${{ github.run_number }}" ci\aura.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: AURA-windows
          path: |
            AURA-Setup.exe
            AURA-Windows-portable.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AURA build ${{ github.run_number }}
          files: |
            AURA-Setup.exe
            AURA-Windows-portable.zip
