name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android runner if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name reel --org dev.reel
            rm -rf test
          fi

      - name: Patch manifest (permissions, app name)
        run: |
          python3 - <<'PY'
          f = 'android/app/src/main/AndroidManifest.xml'
          s = open(f, encoding='utf-8').read()
          perms = (
              '<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n'
              '    '
          )
          if 'MANAGE_EXTERNAL_STORAGE' not in s:
              s = s.replace('<application', perms + '<application', 1)
          s = s.replace('android:label="reel"', 'android:label="Reel"')
          open(f, 'w', encoding='utf-8').write(s)
          PY

      - name: Force compileSdk 36 on plugins
        run: |
          python3 - <<'PY'
          f = 'android/build.gradle.kts'
          s = open(f, encoding='utf-8').read()
          block = """subprojects {
              if (name != "app") {
                  afterEvaluate {
                      val ext = extensions.findByName("android")
                      if (ext != null) {
                          try {
                              ext.javaClass.methods
                                  .firstOrNull { it.name == "setCompileSdk" && it.parameterCount == 1 }
                                  ?.invoke(ext, 36)
                          } catch (e: Throwable) {
                          }
                      }
                  }
              }
          }

          """
          if 'setCompileSdk' not in s:
              if 'allprojects' in s:
                  s = s.replace('allprojects', block + 'allprojects', 1)
              else:
                  s = block + s
          open(f, 'w', encoding='utf-8').write(s)
          PY

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Reel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Reel-apk
          path: Reel.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Reel build ${{ github.run_number }}
          files: Reel.apk
