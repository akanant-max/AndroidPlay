name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android runner if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name reel --org dev.reel
            rm -rf test
          fi

      - name: Patch Android project (permissions, open-with, PiP, SDK)
        run: python3 ci/patch.py

      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Signing key
        env:
          KS: ${{ secrets.REEL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/reel.jks"
            echo "REEL_KEYSTORE=$RUNNER_TEMP/reel.jks" >> "$GITHUB_ENV"
            echo "Using the permanent Reel signing key"
          else
            echo "::warning::No REEL_KEYSTORE_B64 secret - building with a throwaway debug key"
          fi

      - name: Build APK
        env:
          REEL_KEY_PASS: ${{ secrets.REEL_KEY_PASS }}
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Reel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Reel-apk
          path: Reel.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Reel build ${{ github.run_number }}
          files: Reel.apk
